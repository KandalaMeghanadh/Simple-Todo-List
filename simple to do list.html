
<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
            padding: 30px;
        }

        .box {
            background-color: white;
            padding: 20px;
            margin: auto;
            max-width: 350px;
            border-radius: 10px;
        }

        li {
            padding: 10px;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>My To-Do List</h2>

        <ul>
            <li>Learn C Programming</li>
            <li>Practice HTML and CSS</li>
            <li>Complete College Assignments</li>
            <li>Learn Python</li>
        </ul>
    </div>

</body>
</html>
